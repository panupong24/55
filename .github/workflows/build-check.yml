name: Build check

# Builds every pull request (without deploying) so problems show up before merge.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Report bundle sizes on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build size report"
            echo ""
            echo "| file | raw KB | gzip KB |"
            echo "|---|---:|---:|"
            for f in $(ls -S dist/assets/*.js dist/assets/*.css); do
              raw=$(( $(stat -c%s "$f") / 1024 ))
              gz=$(( $(gzip -9 -c "$f" | wc -c) / 1024 ))
              echo "| $(basename "$f") | $raw | $gz |"
            done
            echo ""
            echo "Entry script(s) in index.html:"
            echo '```'
            grep -oE '<(script|link)[^>]*(src|href)="/assets/[^"]*"[^>]*>' dist/index.html
            echo '```'
            echo "Service worker precache entries: $(grep -o 'url:"[^"]*"' dist/sw.js | wc -l)"
          } > size-report.md
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file size-report.md
