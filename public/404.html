<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>Rainbow Vibe Quiz</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      // This script takes the current URL and converts the path and query
      // string into just a query string parameter, then redirects the browser
      // to the root URL with the path in query string and original hash.
      //
      // pathSegmentsToKeep: 0 because the custom domain (www.gaykub.online)
      // is deployed at root '/' (not a GitHub project subpath like /repo-name/ or /55/)
      var pathSegmentsToKeep = 0;

      var l = window.location;
      var pathname = l.pathname;
      var cleanSegments = pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var searchParams = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';

      var redirectUrl =
        l.protocol +
        '//' +
        l.hostname +
        (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '/?/' +
        cleanSegments +
        searchParams +
        l.hash;

      l.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
